# Flatpak build of OpenKeyForge.
#
# Repackages the .deb that `tauri build` produces (the approach Tauri's
# Flatpak guide recommends), so the Flatpak runs the exact binary the other
# Linux packages ship. CI copies the .deb next to this file as
# openkeyforge.deb before running flatpak-builder; see
# .github/workflows/build.yml.
#
# The keypad is a raw HID device, so the sandbox needs --device=all, and the
# host still needs the udev rule (packaging/linux/70-openkeyforge.rules),
# which a Flatpak can't install.
id: io.github.hellfirexd.OpenKeyForge
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: openkeyforge
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  # Shell and Open actions run programs on the host through flatpak-spawn.
  - --talk-name=org.freedesktop.Flatpak
  # The optional tray icon (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  # The tray icon needs libayatana-appindicator, which the GNOME runtime
  # lacks. Flathub's shared module builds it; to enable the tray here, add
  # https://github.com/flathub/shared-modules as a git submodule at
  # packaging/flatpak/shared-modules and list
  #   - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  # above this module. Without it the app runs and reports that the tray
  # icon can't be created.
  - name: openkeyforge
    buildsystem: simple
    sources:
      - type: file
        path: openkeyforge.deb
      - type: file
        path: io.github.hellfirexd.OpenKeyForge.metainfo.xml
    build-commands:
      - ar -x openkeyforge.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/openkeyforge /app/bin/openkeyforge
      # Flatpak wants the desktop file and icons named after the app id.
      - install -Dm644 usr/share/applications/*.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - |
        for icon in usr/share/icons/hicolor/*/apps/*.png; do
          size=$(basename "$(dirname "$(dirname "$icon")")")
          # Tauri also writes a 256x256@2 HiDPI folder; keep plain NxN sizes.
          case "$size" in *@*) continue ;; esac
          install -Dm644 "$icon" "/app/share/icons/hicolor/${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

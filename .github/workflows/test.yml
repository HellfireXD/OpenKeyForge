name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libusb-1.0-0-dev patchelf

      - name: install frontend dependencies
        run: npm ci

      - name: check frontend
        run: npm run check

      - name: run frontend tests
        run: npm test

      - name: build frontend
        run: npm run build

      - name: check rust formatting (app crate; ch57x keeps upstream's style)
        run: cargo fmt -p openkeyforge --check

      - name: run cargo test
        run: cargo test --locked --workspace --all-features

      - name: run clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  # The agent's hotkey code and the hidapi backends differ per platform, so
  # the app must at least compile on each.
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: build frontend (tauri embeds it at compile time)
        run: |
          npm ci
          npm run build

      - name: run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: run cargo test
        run: cargo test --locked --workspace

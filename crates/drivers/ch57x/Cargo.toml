[package]
name = "openkeyforge-driver-ch57x"
version.workspace = true
edition = "2024"
description = "OpenKeyForge driver for CH57x macro keypads: translates keymaps for the ch57x engine"
license = "GPL-3.0-or-later"

[lib]
name = "okf_driver_ch57x"

[dependencies]
okf_core = { package = "openkeyforge-core", path = "../../core" }
ch57x = { path = "../../engines/ch57x", default-features = false }
anyhow = "1.0"
serde_yaml = "0.9"
itertools = "0.10"

[dev-dependencies]
serde_json = "1"
